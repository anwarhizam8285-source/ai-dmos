steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-dmos-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-dmos-backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-dmos-backend:$SHORT_SHA'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-cloudrun'
    args:
      - 'run'
      - 'deploy'
      - 'ai-dmos-backend'
      - '--filename=.'
      - '--location=asia-southeast1'
      - '--region=asia-southeast1'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-southeast1'
      - 'CLOUDSDK_RUN_PLATFORM=managed'
    waitFor: ['push-image']

images:
  - 'gcr.io/$PROJECT_ID/ai-dmos-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/ai-dmos-backend:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
timeout: '1800s'

substitutions:
  _REGION: 'asia-southeast1'
  _SERVICE_NAME: 'ai-dmos-backend'
  _MEMORY: '512Mi'
  _CPU: '1'

tags:
  - 'gke-deploy'
  - 'ai-dmos-backend'
  - 'cloud-run'
